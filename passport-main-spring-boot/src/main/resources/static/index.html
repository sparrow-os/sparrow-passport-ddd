<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>麻雀窝 Passport 认证服务</title>
    <meta name="description" content="麻雀窝统一认证服务 (Passport) 欢迎页"/>
    <meta name="application-name" content="麻雀窝 Passport"/>
    <style>
        :root {
            --brand: #2f6fed;
            --brand-dark: #1e4fc4;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
            --bg: #f6f8fb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            color: var(--text);
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
            text-align: center;
        }

        .logo {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--brand), var(--brand-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            color: #fff;
            margin-bottom: 24px;
            box-shadow: 0 10px 30px rgba(47, 111, 237, 0.25);
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .subtitle {
            margin-top: 12px;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.6;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 20px;
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: #fff;
            color: #16a34a;
            font-size: 13px;
            font-weight: 500;
        }

        .badge::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #16a34a;
        }

        .links {
            margin-top: 40px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }

        .links a {
            padding: 10px 22px;
            border-radius: 8px;
            background: #fff;
            border: 1px solid var(--border);
            color: var(--text);
            text-decoration: none;
            font-size: 14px;
            transition: all 0.15s ease;
        }

        .links a:hover {
            border-color: var(--brand);
            color: var(--brand);
            box-shadow: 0 4px 12px rgba(47, 111, 237, 0.12);
        }

        footer {
            padding: 20px;
            text-align: center;
            color: var(--muted);
            font-size: 12px;
        }
    </style>
</head>
<body>
<main class="hero">
    <div class="logo">雀</div>
    <h1>麻雀窝 Passport</h1>
    <p class="subtitle">
        统一身份认证服务已就绪<br/>
        登录、注册、找回密码等能力由此服务提供
    </p>
    <span class="badge">服务运行中</span>

    <nav class="links">
        <a href="/login">用户登录</a>
        <a href="/register">立即注册</a>
        <a href="/swagger-ui.html">接口文档</a>
        <a href="/open-api.html">OpenAPI 集成说明</a>
    </nav>
</main>

<footer>麻雀窝 · Sparrow Passport</footer>
</body>
</html>
