<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <base/>
    <title>邮箱-麻雀窝</title>
    <meta content="no-cache" http-equiv="pragma"/>
    <meta content="no-cache" http-equiv="cache-control"/>
    <meta content="0" http-equiv="expires"/>
    <meta content="邮箱" http-equiv="keywords"/>
    <meta content="邮箱" http-equiv="description"/>
    <th:block th:include="/frames::global_resource"/>
    <script src="http://r.sparrowzoo.net/scripts/language/zh_cn/user.js?v=1.0"
            type="text/javascript"></script>
    <script src="http://r.sparrowzoo.net/ext/scripts/passport.js?v=1.0"
            type="text/javascript"></script>

</head>
<body>
<script language="javascript" src="http://r.sparrowzoo.net/scripts/baidu.js?v=1.0" type="text/javascript"></script>
<div class="body">
    <div class="header">
        <h1>麻雀窝-邮箱激活</h1>
        <h2>
            邮箱激活 <span th:text="${param.email}"></span>
            <input id="hdnEmail" th:value="${param.email}" type="hidden">
        </h2>
    </div>
    <div class="content">
        <div class="pure-controls">
            <input class="pure-button pure-button-primary button-xlarge pure-input-1-4" id="btnResentActiveEmail"
                   type="submit" value="发送激活邮件"/>
        </div>
    </div>
</div>
</body>
</html>
