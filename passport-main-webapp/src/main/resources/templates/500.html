<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>服务异常 · 麻雀窝 Passport</title>
    <meta name="description" content="麻雀窝统一认证服务 (Passport) 服务异常页"/>
    <style>
        :root {
            color-scheme: dark;
            --brand: #6d5cff;
            --cyan: #22d3ee;
            --pink: #a855f7;
            --text: #f4f4f7;
            --muted: #9a9ab0;
            --subtle: #64647c;
            --panel: rgba(255, 255, 255, .04);
            --border: rgba(255, 255, 255, .08);
            --bg: #07070d;
            --gradient: linear-gradient(110deg, var(--brand), var(--cyan) 52%, var(--pink));
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            position: relative;
            isolation: isolate;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            color: var(--text);
            background:
                radial-gradient(ellipse at 16% 14%, rgba(109, 92, 255, .14), transparent 48%),
                radial-gradient(ellipse at 85% 68%, rgba(34, 211, 238, .07), transparent 44%),
                radial-gradient(ellipse at 72% 100%, rgba(168, 85, 247, .09), transparent 45%),
                var(--bg);
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255, 255, 255, .018) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, .018) 1px, transparent 1px),
                radial-gradient(rgba(255, 255, 255, .035) .5px, transparent .5px);
            background-size: 56px 56px, 56px 56px, 4px 4px;
            mask-image: linear-gradient(#000, rgba(0, 0, 0, .25));
        }

        ::selection {
            background: rgba(109, 92, 255, .35);
            color: var(--text);
        }

        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 72px 24px;
            text-align: center;
        }

        .code {
            position: relative;
            font-size: clamp(100px, 18vw, 160px);
            font-weight: 700;
            line-height: 1;
            letter-spacing: -.065em;
            background: var(--gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 24px;
            filter: drop-shadow(0 12px 32px rgba(109, 92, 255, .16));
            user-select: none;
        }

        .code::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: -8px;
            transform: translateX(-50%);
            width: 64px;
            height: 2px;
            border-radius: 999px;
            background: var(--gradient);
            opacity: .65;
        }

        h1 {
            margin-top: 16px;
            font-size: clamp(24px, 5vw, 30px);
            font-weight: 600;
            letter-spacing: -.025em;
            background: var(--gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            margin-top: 12px;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.9;
            max-width: 420px;
        }

        .links {
            margin-top: 32px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }

        .links a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 46px;
            padding: 11px 26px;
            border-radius: 999px;
            background: var(--panel);
            border: 1px solid var(--border);
            color: var(--text);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease, background-color .2s ease;
        }

        .links a.primary {
            background: var(--gradient);
            border-color: transparent;
            color: var(--bg);
            box-shadow: 0 6px 24px rgba(109, 92, 255, .2);
        }

        .links a:hover {
            border-color: rgba(109, 92, 255, .45);
            background-color: rgba(255, 255, 255, .07);
            box-shadow: 0 10px 26px rgba(0, 0, 0, .2);
            transform: translateY(-2px);
        }

        .links a.primary:hover {
            color: var(--bg);
            box-shadow: 0 10px 30px rgba(109, 92, 255, .3);
        }

        .links a:focus-visible {
            outline: 2px solid var(--cyan);
            outline-offset: 4px;
        }

        footer {
            padding: 24px;
            text-align: center;
            color: var(--subtle);
            font-size: 12px;
            letter-spacing: .04em;
        }

        @media (max-width: 480px) {
            .hero { padding: 48px 20px; }
            .subtitle { font-size: 14px; }
            .links { gap: 10px; }
            .links a { padding-inline: 22px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .links a { transition: none; }
            .links a:hover { transform: none; }
        }
    </style>
</head>
<body>
<main class="hero">
    <div class="code">500</div>
    <h1>服务暂时开小差了</h1>
    <p class="subtitle">
        服务器遇到了一点问题，无法完成您的请求。<br/>
        请稍后重试，若问题持续存在请联系管理员。
    </p>

    <nav class="links">
        <a class="primary" href="javascript:location.reload()">刷新重试</a>
        <a href="/">返回首页</a>
    </nav>
</main>

<footer>麻雀窝 · Sparrow Passport</footer>
</body>
</html>
