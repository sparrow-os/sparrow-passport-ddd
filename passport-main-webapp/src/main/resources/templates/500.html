<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>服务异常 · 麻雀窝 Passport</title>
    <meta name="description" content="麻雀窝统一认证服务 (Passport) 服务异常页"/>
    <style>
        :root {
            --brand: #2f6fed;
            --brand-dark: #1e4fc4;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
            --bg: #f6f8fb;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            color: var(--text);
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
            text-align: center;
        }

        .code {
            position: relative;
            font-size: 120px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -4px;
            background: linear-gradient(135deg, var(--brand), var(--brand-dark));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
            user-select: none;
        }

        .code::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: -8px;
            transform: translateX(-50%);
            width: 64px;
            height: 4px;
            border-radius: 2px;
            background: linear-gradient(90deg, transparent, var(--brand), transparent);
        }

        h1 {
            margin-top: 16px;
            font-size: 26px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .subtitle {
            margin-top: 12px;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.7;
            max-width: 420px;
        }

        .links {
            margin-top: 36px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }

        .links a {
            padding: 10px 22px;
            border-radius: 8px;
            background: #fff;
            border: 1px solid var(--border);
            color: var(--text);
            text-decoration: none;
            font-size: 14px;
            transition: all 0.15s ease;
        }

        .links a.primary {
            background: linear-gradient(135deg, var(--brand), var(--brand-dark));
            border-color: transparent;
            color: #fff;
            box-shadow: 0 6px 16px rgba(47, 111, 237, 0.25);
        }

        .links a:hover {
            border-color: var(--brand);
            color: var(--brand);
            box-shadow: 0 4px 12px rgba(47, 111, 237, 0.12);
            transform: translateY(-1px);
        }

        .links a.primary:hover {
            color: #fff;
            box-shadow: 0 8px 20px rgba(47, 111, 237, 0.35);
        }

        footer {
            padding: 20px;
            text-align: center;
            color: var(--muted);
            font-size: 12px;
        }
    </style>
</head>
<body>
<main class="hero">
    <div class="code">500</div>
    <h1>服务暂时开小差了</h1>
    <p class="subtitle">
        服务器遇到了一点问题，无法完成您的请求。<br/>
        请稍后重试，若问题持续存在请联系管理员。
    </p>

    <nav class="links">
        <a class="primary" href="javascript:location.reload()">刷新重试</a>
        <a href="/">返回首页</a>
    </nav>
</main>

<footer>麻雀窝 · Sparrow Passport</footer>
</body>
</html>
