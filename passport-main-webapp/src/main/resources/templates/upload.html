<html lang="en">
<head>
    <title>上传</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <style>
        :root {
            color-scheme: dark;
            --bg: #07070d;
            --panel: rgba(255, 255, 255, .04);
            --border: rgba(255, 255, 255, .08);
            --text: #f4f4f7;
            --muted: #9a9ab0;
            --subtle: #64647c;
            --brand: #6d5cff;
            --cyan: #22d3ee;
            --gradient: linear-gradient(110deg, var(--brand), var(--cyan) 52%, #a855f7);
        }
        * { box-sizing: border-box; }
        html { background: var(--bg); }
        body {
            position: relative; isolation: isolate;
            margin: 0; min-height: 100vh; min-height: 100svh; padding: 32px 20px;
            display: flex; align-items: center; justify-content: center;
            background:
                radial-gradient(ellipse at 16% 14%, rgba(109, 92, 255, .14), transparent 48%),
                radial-gradient(ellipse at 85% 68%, rgba(34, 211, 238, .07), transparent 44%),
                radial-gradient(ellipse at 72% 100%, rgba(168, 85, 247, .09), transparent 45%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            color: var(--text); -webkit-font-smoothing: antialiased;
        }
        body::before {
            content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
            background-image:
                linear-gradient(rgba(255, 255, 255, .018) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, .018) 1px, transparent 1px),
                radial-gradient(rgba(255, 255, 255, .035) .5px, transparent .5px);
            background-size: 56px 56px, 56px 56px, 4px 4px;
            mask-image: linear-gradient(#000, rgba(0, 0, 0, .25));
        }
        ::selection { background: rgba(109, 92, 255, .35); color: var(--text); }
        .card {
            width: 100%; max-width: 520px; padding: 40px;
            background: var(--panel); border: 1px solid var(--border); border-radius: 18px;
            box-shadow: 0 24px 72px rgba(0, 0, 0, .3), inset 0 1px 0 rgba(255, 255, 255, .025);
            backdrop-filter: blur(16px);
            transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
        }
        form { margin: 0; }
        .row { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
        .row:last-child { margin-bottom: 0; padding-top: 8px; justify-content: flex-end; }
        .row label { flex: 0 0 5em; font-size: 14px; font-weight: 500; color: var(--muted); }
        input[type="text"], input[type="file"] {
            min-width: 0; width: 100%; min-height: 46px; padding: 12px 14px;
            font: inherit; font-size: 14px; color: var(--text); background: #0c0c16;
            border: 1px solid var(--border); border-radius: 18px;
            transition: border-color .2s ease, box-shadow .2s ease;
        }
        input[type="file"] { padding: 7px; font-size: 12px; color: var(--muted); }
        input[type="file"]::file-selector-button {
            margin-right: 10px; padding: 8px 12px; font: inherit; color: var(--text);
            border: 1px solid var(--border); border-radius: 999px;
            background: rgba(109, 92, 255, .18); cursor: pointer;
        }
        input::placeholder { color: var(--subtle); }
        input[type="text"]:focus, input[type="file"]:focus {
            outline: none; border-color: rgba(109, 92, 255, .65); box-shadow: 0 0 0 3px rgba(109, 92, 255, .14);
        }
        input[type="submit"] {
            min-height: 46px; padding: 12px 32px; font: inherit; font-size: 14px; font-weight: 650;
            color: var(--bg); background: var(--gradient); border: 1px solid transparent;
            border-radius: 999px; cursor: pointer; box-shadow: 0 6px 24px rgba(109, 92, 255, .2);
            transition: transform .2s ease, box-shadow .2s ease;
        }
        input[type="submit"]:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(109, 92, 255, .3); }
        input[type="text"]:focus-visible,
        input[type="file"]:focus-visible,
        input[type="submit"]:focus-visible { outline: 2px solid var(--cyan); outline-offset: 4px; }
        @media (hover: hover) {
            .card:hover { transform: translateY(-4px); border-color: rgba(255, 255, 255, .14); box-shadow: 0 30px 80px rgba(0, 0, 0, .36); }
        }
        @media (max-width: 480px) {
            .card { padding: 28px 22px; }
            .row { align-items: stretch; flex-direction: column; gap: 10px; }
            .row label { flex-basis: auto; }
            input[type="submit"] { width: 100%; }
        }
        @media (prefers-reduced-motion: reduce) {
            .card, input { transition: none; }
            .card:hover, input[type="submit"]:hover { transform: none; }
        }
    </style>
</head>
<body>
<div class="card">
    <form action="upload.do">
        <div class="row">
            <label>文件</label>
            <input type="file">
        </div>
        <div class="row">
            <label>用户名</label>
            <input type="text" name="userName" value="zhangsan"/>
        </div>
        <div class="row">
            <input type="submit">
        </div>
    </form>
</div>
</body>
</html>
