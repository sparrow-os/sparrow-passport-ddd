<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>用户登录-麻雀窝</title>
    <meta content="麻雀窝提供" name="description"/>
    <meta content="麻雀窝" name="application-name"/>
    <th:block th:include="/frames::global_resource"/>
    <script language="javascript" th:src="${resource}+'/ext/scripts/language/'+${sparrow_request_language}+'/user.js?v='+${resource_version}"
            type="text/javascript"></script>
</head>
<div class="body">
    <div class="header">
        <h1>麻雀窝-个人中心</h1>
        <h2 class="header">程序员有问题就上麻雀窝 和大牛直接聊</h2>
    </div>

    <div class="tab" id="tabs">
        <div class="pure-menu pure-menu-horizontal" id="sparrow_14553803572462387">

        </div>

        <div class="tab-content" id="sparrow_7456766584821994">

        </div>
    </div>

    <div class="content">
        <br/>
        <span class="error" id="errorRegister" name="error"></span>
        <form action="/register/email" class="pure-form pure-form-aligned" method="post" th:action="${root}+'/modify'">
            <input id="hdnUserId" th:value="${user.userId}" type="hidden"/>
            <fieldset>
                <div class="pure-control-group">
                    <label> 用户名 </label>
                    <span>${profile?.userName}</span>
                </div>
                <div class="pure-control-group">
                    <label> 昵称 </label>
                    <span>${profile?.nickName}</span>
                </div>
                <div class="pure-control-group">
                    <img src="${profile?.avatar}"
                         style="width: 150px; height: 150px;"/> <br/>
                </div>
                <div class="pure-control-group">
                    <label> 出生日期 </label>
                    <input id="txtBirthday" name="birthday" tabIndex="2"
                           type="text" value=""/>
                    <span class="error" id="errorRegUserName" name="register_user_name"></span>
                </div>

                <div class="pure-control-group">

                </div>
                <div class="pure-control-group">
                    注册时间:${profile?.createTime}
                </div>
                <div class="pure-control-group">
                    最后登录时间:${profile?.lastLoginTime}
                </div>
                <div class="pure-control-group">
                    <label>个性签名</label>
                    <textarea cols="50" id="txtPersonalSignature"
                              name="user.personalSignature" rows="3"></textarea>
                </div>
                <div class="pure-controls">
                    <button class="pure-button pure-button-primary" onclick="$.v.getValidateResult(regInfo);" onenter="true"
                            type="button">更新
                    </button>
                </div>
            </fieldset>
        </form>
    </div>
</div>
</body>


<body style="width:700px;height:520px;">
<div class="body">
    <div class="frame">
        <div class="content">
            <div class="userName" id="userName">
                <a class="updateTime" id="updateTime" th:text="'上次更新'+${user?.modifiedTime}"></a>
                <span>${user?.userName}</span>
            </div>

            <div class="title">
                <span>基本信息</span>
            </div>
            <table cellpadding="4" cellspacing="0">
                <tr>
                    <th>昵称:</th>
                    <td class="td-input">
                        <input id="txtUserName" maxLength="8"
                               name="userName" onblur='$.v.isNull(userInfo.txtUserName);' onfocus='$.v.showMessage(userInfo.txtUserName);'
                               th:value="${user.userName}" type="text"/></td>
                    <td class="td-message"><span class="prompt" id="errorUserName"></span></td>
                    <td align="center" class="user-avatar" rowspan="8" valign="top">
                    </td>
                </tr>

                <tr>

            </table>
        </div>
    </div>
</div>
<input class="button" onclick="$.submit();" type="button"
       value="提  交"/>
</form>
</body>
</html>
