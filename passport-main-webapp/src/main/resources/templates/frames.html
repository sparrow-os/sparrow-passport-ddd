<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="global_resource">
    <link rel="stylesheet" type="text/css"
          th:href="${resource}+'/styles/pure-css/pure-min.css?v='+${resource_version}"/>
    <!--[if lte IE 8]>
    <link rel="stylesheet" type="text/css" th:href="${resource}+'/styles/layouts-old-ie.css?v='+${resource_version}"/>
    <![endif]-->
    <!--[if gt IE 8]><!-->
    <link rel="stylesheet" type="text/css" th:href="${resource}+'/styles/layouts.css?v='+${resource_version}"/>
    <!--<![endif]-->
    <link rel="stylesheet" type="text/css" th:href="${resource}+'/styles/sparrow.css?v='+${resource_version}"/>
    <link rel="stylesheet" type="text/css" th:href="${resource}+'/styles/modal.css?v='+${resource_version}"/>
    <script type="text/javascript"
            th:src="${resource}+'/scripts/sparrow.js?v='+${resource_version}"></script>
    <style>
        :root {
            --brand: #2f6fed;
            --brand-dark: #1e4fc4;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
            --bg: #f4f6fb;
        }

        * {
            box-sizing: border-box;
        }

        html {
            background: linear-gradient(180deg, #eaf0ff 0%, #f6f8fb 300px);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: var(--brand);
            text-decoration: none;
            transition: color .15s ease;
        }

        a:hover {
            color: var(--brand-dark);
        }

        /* ============ 顶部 banner ============ */
        .banner {
            background: #ffffff;
            border-bottom: 1px solid var(--border);
            box-shadow: 0 1px 3px rgba(16, 24, 40, .04);
        }

        .banner-inner {
            max-width: 1080px;
            margin: 0 auto;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            font-size: 14px;
            font-weight: 500;
        }

        /* ============ 卡片容器 ============ */
        .body {
            max-width: 680px;
            margin: 40px auto;
            padding: 40px 48px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(16, 24, 40, .10);
        }

        /* 无 .body 包裹的页面（login.html / profile.html） */
        body > .header {
            max-width: 680px;
            margin: 40px auto 0;
            padding: 36px 48px 6px;
            background: #ffffff;
            border-radius: 16px 16px 0 0;
        }

        body > .content {
            max-width: 680px;
            margin: 0 auto 40px;
            padding: 6px 48px 40px;
            background: #ffffff;
            border-radius: 0 0 16px 16px;
            box-shadow: 0 20px 60px rgba(16, 24, 40, .10);
        }

        /* ============ 标题区 ============ */
        .header h1 {
            margin: 0 0 6px;
            font-size: 26px;
            font-weight: 600;
            letter-spacing: .5px;
            color: var(--text);
        }

        .header h2 {
            margin: 0;
            font-size: 14px;
            font-weight: 400;
            color: var(--muted);
        }

        .header h2 a {
            font-weight: 500;
        }

        .content {
            color: var(--text);
        }

        .content a {
            color: var(--brand);
        }

        /* ============ 表单 ============ */
        .pure-form-aligned .pure-control-group {
            margin-bottom: 18px;
        }

        .pure-form-aligned .pure-control-group label {
            width: 7.5em;
            margin-right: 1.2em;
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
            text-align: right;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"],
        textarea {
            padding: 10px 14px;
            font-size: 14px;
            color: var(--text);
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            transition: border-color .15s ease, box-shadow .15s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        input[type="email"]:focus,
        textarea:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 3px rgba(47, 111, 237, .15);
        }

        .pure-control-group img[src="/captcha"] {
            height: 40px;
            border-radius: 8px;
            border: 1px solid var(--border);
            vertical-align: middle;
            margin-left: 8px;
            cursor: pointer;
        }

        /* ============ 按钮 ============ */
        .pure-button,
        .pure-button-primary,
        .button {
            padding: 11px 26px;
            font-size: 15px;
            font-weight: 500;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all .18s ease;
        }

        .pure-button-primary {
            background: linear-gradient(135deg, var(--brand), var(--brand-dark));
            color: #fff;
            box-shadow: 0 8px 20px rgba(47, 111, 237, .28);
        }

        .pure-button-primary:hover {
            box-shadow: 0 12px 26px rgba(47, 111, 237, .38);
            transform: translateY(-1px);
            color: #fff;
        }

        .pure-button-primary:active {
            transform: translateY(0);
            box-shadow: 0 6px 14px rgba(47, 111, 237, .28);
        }

        /* ============ 顶部菜单 / Tab ============ */
        .pure-menu {
            background: transparent;
        }

        .pure-menu-horizontal {
            margin: 0 0 20px;
            border-bottom: 1px solid var(--border);
        }

        .pure-menu-horizontal .pure-menu-list {
            display: flex;
            gap: 4px;
        }

        .pure-menu-horizontal .pure-menu-item {
            height: auto;
        }

        .pure-menu-horizontal .pure-menu-link {
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 500;
            color: var(--muted);
            border-radius: 8px 8px 0 0;
        }

        .pure-menu-horizontal .pure-menu-item.pure-menu-selected .pure-menu-link {
            color: var(--brand);
            border-bottom: 2px solid var(--brand);
            background: transparent;
        }

        /* ============ 提示信息 ============ */
        .error,
        .prompt,
        .pure-form-message-inline {
            font-size: 13px;
        }

        .error {
            color: #ef4444;
            margin-left: 8px;
        }

        .prompt {
            color: var(--muted);
            margin-left: 8px;
        }

        .highlight {
            color: #b45309;
            font-weight: 500;
        }

        /* ============ 成功 / 错误提示页 ============ */
        .content .pure-button,
        .content input[type="submit"],
        .content input[type="button"] {
            margin-top: 12px;
        }

        /* ============ 头像页 ============ */
        .avatar-content {
            max-width: 680px;
            margin: 40px auto;
            padding: 36px 44px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(16, 24, 40, .10);
        }

        .avatar-content .block {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
        }

        .avatar-content .current-avatar img,
        .avatar-content .local-upload img {
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg);
        }

        .avatar-content .local-file {
            margin-top: 12px;
            font-size: 13px;
            color: var(--muted);
        }

        .avatar-content .buttons_group {
            margin-top: 16px;
        }

        /* ============ 个人中心表格 ============ */
        .frame table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .frame table th {
            text-align: right;
            padding: 8px 12px;
            color: var(--muted);
            font-weight: 500;
            white-space: nowrap;
        }

        .frame table td {
            padding: 8px 12px;
        }

        .frame .title span {
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
        }

        .frame .userName {
            font-size: 18px;
            font-weight: 600;
        }

        .frame .updateTime {
            font-size: 12px;
            color: var(--muted);
            margin-left: 10px;
            font-weight: 400;
        }

        .frame .user-avatar {
            width: 140px;
        }

        /* ============ 响应式 ============ */
        @media (max-width: 720px) {
            .body,
            body > .header,
            body > .content,
            .avatar-content {
                max-width: 100%;
                margin-left: 16px;
                margin-right: 16px;
                padding-left: 24px;
                padding-right: 24px;
            }

            .pure-form-aligned .pure-control-group label {
                width: auto;
                display: block;
                text-align: left;
                margin-bottom: 6px;
            }
        }
    </style>
</div>
<div th:fragment="banner" class="banner">
    <div class="banner-inner">
        <a href="http://www.sparrowzoo.com">回到首页</a>
    </div>
</div>
</body>
</html>
