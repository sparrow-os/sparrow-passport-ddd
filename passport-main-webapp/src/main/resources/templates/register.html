<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>新用户注册-程序员有问题就上麻雀窝 和大牛直接聊</title>
    <meta content="register 注册 " name="keywords"/>
    <meta content="程序员有问题就上麻雀窝 和大牛直接聊" name="description"/>
    <meta content="麻雀窝" name="application-name"/>
    <th:block th:include="/frames::global_resource"/>
    <script th:src="${resource}+'/ext/scripts/language/'+${sparrow_request_language}+'/user.js?v='+${resource_version}"
            type="text/javascript"></script>
    <script type="text/javascript">
        document.ready(function () {
            $.v.init(regInfo);
        });
    </script>
</head>
<body>
<div class="body">
    <th:block th:include="/frames::banner"/>
    <div class="header">
        <h1>麻雀窝- 新用户注册</h1>
        <h2>
            您已有帐号?
            <a th:href="${root_path}+'/login'">直接登录</a>

        </h2>
        <h2 class="header">程序员有问题就上麻雀窝 和大牛直接聊</h2>
    </div>

    <div class="content">
        <br/>
        <span class="error" id="errorRegister" name="error"></span>
        <form action="/register/email" class="pure-form pure-form-aligned" method="post">
            <input class="" id="hdnIntroducer" name="introducer" type="hidden"/>
            <fieldset>
                <div class="pure-control-group">
                    <label> 电子邮箱 </label>
                    <input id="txtEmail" name="email" tabindex="1"
                           type="text" value=""/>
                    <span class="error" id="errorEmail" name="register_user_email"></span>
                </div>
                <div class="pure-control-group">
                    <label> 用户名 </label>
                    <input id="txtRegUserName" name="userName" tabIndex="2"
                           type="text" value=""/>
                    <span class="error" id="errorRegUserName" name="register_user_name"></span>
                </div>
                <div class="pure-control-group">
                    <label> 登陆密码 </label> <input class="input" id="txtRegPassword"
                                                     maxlength="16"
                                                     name="password"
                                                     tabindex="3" type="password"/>
                    <span class="error" id="errorRegPassword" name="register_password"></span>
                </div>
                <div class="pure-control-group">
                    <label> 确认密码 </label> <input class="input" id="txtConfirmPassword" maxlength="16"
                                                     name="passwordConfirm" tabindex="4"
                                                     type="password"/>

                    <span class="error" id="errorConfirmPassword" name="register_confirm_password"></span>
                </div>
                <div class="pure-control-group">
                    <label> 验证码 </label>
                    <input class="input"
                           id="txtRegValidateCode" maxlength="4" name="captcha"
                           tabindex="5" type="text"/>
                    <img align="absMiddle" alt="validate code" id="imgValidateCode" onclick="$(this).fresh();"
                         src="/captcha"/>
                    <a href="javascript:$('#imgValidateCode').fresh();"> 看不清 换一张</a>
                    <span class="error" id="errorRegValidateCode" name="register_validate_code"></span>
                </div>
                <div class="pure-controls">

                    <button class="pure-button pure-button-primary" onclick="$.v.getValidateResult(regInfo);" onenter="true"
                            type="button">注册
                    </button>
                </div>
            </fieldset>
        </form>
    </div>
</div>
</body>
</html>
