<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>快捷登录</title>
    <meta content="麻雀窝" name="application-name"/>
    <meta content="麻雀窝" name="msapplication-tooltip"/>
    <th:block th:include="/frames::global_resource"/>
    <script th:src="${resource}+'/ext/scripts/language/zh_cn/user.js?v='+${resource_version}"
            type="text/javascript"></script>
    <script th:src="${resource}+'/ext/scripts/passport.js?v='+${resource_version}"
            type="text/javascript"></script>
</head>
<body style="width: 650px; height:450px;">
<div class="tab" id="tabs">
    <div class="pure-menu pure-menu-horizontal">
        <ul class="pure-menu-list" style="width: 100%;">
            <li class="pure-menu-item pure-menu-selected">
                <a class="pure-menu-link" href="javascript:void(0);"><span>登&nbsp;&nbsp;录</span></a>
            </li>
            <li class="pure-menu-item"><a class="pure-menu-link"
                                          href="javascript:void(0);"><span>注&nbsp;&nbsp;册</span>
            </a></li>
            <li class="pure-menu-item more"><a class="pure-menu-link" href="javascript:void(0);"
                                               onclick="parent.$.win.closeClick();"><span>关闭</span> </a></li>
        </ul>
    </div>
    <div class="tab-content">
        <div class="block" id="divShortCutLogin">
            <form class="pure-form pure-form-aligned" method="post">
                <input name="parameter" type="hidden" value="shortcut"/> <br/>
                <fieldset>
                    <div class="pure-control-group">
                        <label for="txtusername">
                            用户名
                        </label>
                        <input class="input" id="txtUserName" name="userName"
                               onblur="$.v.isNull(loginInfo,this);"
                               onfocus="$.v.showMessage(loginInfo,this);" type="text"/>
                        <span class="pure-form-message-inline" id="errorUserName" name="login_user_name"></span>
                    </div>
                    <div class="pure-control-group">
                        <label>
                            密 码
                        </label>

                        <input class="input" id="txtPassword"
                               name="password"
                               onblur="$.v.isNull(loginInfo,this);" onfocus="$.v.showMessage(loginInfo,this);"
                               type="password"/>
                        <span class="pure-form-message-inline" id="errorPassword" name="login_password"></span>
                    </div>
                    <div class="pure-control-group">
                        <label>
                            验证码
                        </label>
                        <input class="input" id="txtValidateCode"
                               maxlength="4" name="captcha"
                               onblur="$.v.isNull(loginInfo,this);" onfocus="$.v.showMessage(loginInfo,this);" type="text"/>

                        <img id="imgLoginValidateCode"
                             onclick="$(this).fresh()" src="/captcha"/>
                        <a href="javascript:$('#imgLoginValidateCode').fresh();"> 看不清 换一张</a>
                    </div>

                    <div class="pure-controls">
                        <span class="prompt" id="errorValidateCode" name="login_validate_code"></span>
                        <label class="pure-checkbox" for="chbLoginDays">
                            <input id="chbLoginDays" name="loginDays" type="checkbox" value="14"> 两周直接登录(家庭登录模式)<a
                                href="http://localhost:2222/password/find-by-email">忘记密码</a><br/>
                            <span class="highlight">温馨提示</span>为了您的密码安全,如果您在网吧等公共场所请不要勾选此项
                        </label>

                        <button class="pure-button pure-button-primary" id="btnLogin" onenter="true"
                                type="button">登录
                        </button>
                    </div>
                </fieldset>
                <input class="" id="hdnRedirectUrl" name="redirectUrl" type="hidden"/>
            </form>
        </div>
        <div class="none" id="divShortCutRegister">
            <form class="pure-form pure-form-aligned" method="post">
                <input class="" id="hdnIntroducer" name="introducer" type="hidden"/>
                <fieldset>
                    <div class="pure-control-group">

                        <label> 电子邮箱 </label>
                        <input id="txtEmail" name="email"
                               onblur="$.passport.register.validate.email(this);"
                               onfocus="$.v.showMessage(regInfo,this);"
                               tabindex="1" type="text"/>
                        <span class="prompt" id="errorEmail" name="register_user_email"></span>
                    </div>
                    <div class="pure-control-group">
                        <label> 用户名 </label>
                        <input id="txtRegUserName" name="userName"
                               onblur='$.passport.register.validate.user(this);'
                               onfocus='$.v.showMessage(regInfo,this);'
                               tabIndex="2" type="text"/>
                        <span class="prompt" id="errorRegUserName" name="register_user_name"></span>
                    </div>
                    <div class="pure-control-group">
                        <label> 登陆密码 </label> <input class="input" id="txtRegPassword"
                                                         maxlength="16" name="password"
                                                         onblur="$.v.isNull(regInfo,this);" onfocus="$.v.showMessage(regInfo,this);"
                                                         tabindex="3" type="password"/>
                        <span class="prompt" id="errorRegPassword"></span>
                    </div>
                    <div class="pure-control-group">
                        <label> 确认密码 </label> <input class="input" id="txtConfirmPassword" maxlength="16"
                                                         name="passwordConfirm" onblur="$.v.isEqual(regInfo,this);"
                                                         onfocus="$.v.showMessage(regInfo,this);" tabindex="4"
                                                         type="password"/> <span
                            class="prompt" id="errorConfirmPassword"></span>
                    </div>
                    <div class="pure-control-group">
                        <label> 验证码 </label>

                        <input class="input"
                               id="txtRegValidateCode" maxlength="4"
                               name="validateCode"
                               onblur="$.v.isNull(regInfo,this);" onfocus="$.v.showMessage(regInfo,this)"
                               tabindex="5" type="text"/>
                        <img align="absMiddle" alt="validate code" id="imgValidateCode" onclick="$(this).fresh();"
                             src="/captcha"/>
                        <a href="javascript:$('#imgValidateCode').fresh();"> 看不清 换一张</a>
                    </div>
                    <div class="pure-controls">
                        <span class="prompt" id="errorRegValidateCode" name="register_validate_code"></span>
                        <br/>
                        <button class="pure-button pure-button-primary" id="btnRegister" onenter="true"
                                type="button">注册
                        </button>

                        <br/> <br/> <a href="/provision.jsp"
                                       target="_blank">麻雀窝服务条款</a>
                    </div>
                </fieldset>
            </form>
        </div>
    </div>
</div>
</body>
</html>
