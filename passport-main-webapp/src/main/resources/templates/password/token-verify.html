<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <head>
        <base/>
        <title>密码重置-麻雀窝</title>
        <meta content="no-cache" http-equiv="pragma"/>
        <meta content="no-cache" http-equiv="cache-control"/>
        <meta content="0" http-equiv="expires"/>
        <meta content="密码重置" http-equiv="keywords"/>
        <meta content="密码重置" http-equiv="description"/>
        <th:block th:include="/frames::global_resource"/>
        <script src="http://r.sparrowzoo.net/ext/scripts/language/zh_cn/user.js?v=1.0"
                type="text/javascript"></script>
    </head>
<body>
<script src="http://r.sparrowzoo.net/scripts/baidu.js?v=1.0" type="text/javascript"></script>
<div class="body">
    <th:block th:include="/frames::banner"/>
    <div class="header">
        <h1>麻雀窝-密码重置</h1>
        <h2>
            请输入您的新密码
        </h2>
    </div>

    <div class="content">
        <form action="/password/reset-password-by-token" class="pure-form pure-form-aligned" method="post">
            <fieldset>
                <input class="" id="hdnValidateToken" name="token" th:value="${param.token}" type="hidden"/>
                <div class="pure-control-group">
                    <label for="txtPassword">
                        新密码
                    </label>
                    <input id="txtPassword"
                           name="password"
                           onblur="$.v.isNull(password,this);" onfocus="$.v.showMessage(password,this);"
                           type="password"/>
                    <span class="pure-form-message-inline" id="errorPassword"></span>
                </div>
                <div class="pure-control-group">
                    <label for="txtConfirmPassword">确认密码</label>
                    <input id="txtConfirmPassword" name="newPassword2"
                           onblur="$.v.isEqual(password,this);"
                           onfocus="$.v.showMessage(password,this);" type="password"/>
                    <span class="pure-form-message-inline" id="errorConfirmPassword" name="confirm_password"></span>
                </div>

                <div class="pure-controls">
                    <button class="pure-button pure-button-primary" onclick="$.v.getValidateResult(password);" onenter="true"
                            type="button">提交
                    </button>
                </div>
            </fieldset>
        </form>
    </div>
</div>
</body>
</html>
