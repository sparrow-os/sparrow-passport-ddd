<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>找回密码-麻雀窝</title>
    <meta content="no-cache" http-equiv="pragma"/>
    <meta content="no-cache" http-equiv="cache-control"/>
    <meta content="0" http-equiv="expires"/>
    <meta content="找回密码" http-equiv="keywords"/>
    <meta content="找回密码" http-equiv="description"/>

    <th:block th:include="/frames::global_resource"/>

    <script src="http://r.sparrowzoo.net/ext/scripts/language/zh_cn/user.js?v=1.0"
            type="text/javascript"></script>

    <script src="http://r.sparrowzoo.net/ext/scripts/password.js?v=1.0"
            type="text/javascript"></script>
</head>
<body>
<script language="javascript" src="http://r.sparrowzoo.net/scripts/baidu.js?v=1.0" type="text/javascript"></script>
<div class="body">
    <th:block th:include="/frames::banner"/>
    <div class="header">
        <h1>麻雀窝-找回密码</h1>
        <h2>
            通过邮箱找回
        </h2>
    </div>
    <div class="content">
        <div class="pure-controls">
            <input class="pure-input-1-2"
                   id="txtValidateEmail" name="email" onblur="$.v.isEmail(findPassword,this);"
                   onfocus="$.v.showMessage(findPassword,this);" placeholder="请输入验证邮箱"/>
            <span class="prompt" id="errorValidateEmail" name="login_user_name"></span>
        </div>
        <div class="pure-controls">
            <input class="pure-button pure-button-primary button-xlarge pure-input-1-4"
                   id="btnSendPasswordToken"
                   type="button" value="找回"/>
        </div>
    </div>
</div>
</body>
</html>
